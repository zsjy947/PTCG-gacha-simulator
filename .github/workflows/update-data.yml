name: 卡表数据同步

# 每周全量同步 mik.moe 简中卡表；有变化时自动提交，供各端「数据热更新」拉取。
on:
  schedule:
    - cron: "0 21 * * 5"   # 每周五 UTC 21:00（北京时间周六 05:00）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: 全量同步卡表
        run: python fetch_data.py --force
      - name: 有变化才提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "卡表无变化"
          else
            git commit -m "卡表数据自动同步（fetch_data --force）"
            git push
          fi
